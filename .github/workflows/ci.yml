name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f src/index.html
          test -f src/style.css
          test -f src/app.js
          echo "Project files OK"
