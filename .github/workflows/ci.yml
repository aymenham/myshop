name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f src/index.html
          test -f src/style.css
          test -f src/app.js

      - name: Check stylesheet reference
        run: grep 'href="style.css"' src/index.html

      - name: Check JavaScript reference
        run: grep 'src="app.js"' src/index.html

      - name: All checks passed
        run: echo "All checks passed"
